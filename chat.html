<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Blue Icee</title>

 <link rel="stylesheet" href="chat.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="supabase.js"></script>

  <script defer src="chat.js"></script>

</head>

<body class="discord-layout">

  <!-- LEFT SERVER BAR -->

  <aside class="server-sidebar">

    <div class="server-logo">
      BI
    </div>

    <div class="server-divider"></div>

    <div class="server-button active"></div>

    <div class="server-button"></div>

    <div class="server-button"></div>

    <div class="server-button"></div>

  </aside>

  <!-- CHANNEL SIDEBAR -->

  <aside class="channel-sidebar">

    <div class="server-name">
      Blue Icee
    </div>

    <div class="channel-section">

      <span class="section-title">
        REALMS
      </span>

      <button onclick="switchRealm('general')">
        # general
      </button>

      <button onclick="switchRealm('kpop')">
        # kpop
      </button>

      <button onclick="switchRealm('cozy')">
        # cozy
      </button>

      <button onclick="switchRealm('arcade')">
        # arcade
      </button>

    </div>

    <div class="profile-bar">

      <div class="profile-avatar"></div>

      <div class="profile-info">

        <strong>User</strong>

        <span>online</span>

      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="chat-main">

    <!-- TOP BAR -->

    <header class="chat-topbar">

      <div class="channel-current">

        <span>#</span>

        <h2 id="realmName">
          general
        </h2>

      </div>

    </header>

    <!-- MESSAGES -->

    <section
      class="chat-messages"
      id="chatMessages"
    >
    </section>

    <!-- INPUT -->

    <div class="chat-input-wrap">

      <div class="chat-input-box">

        <input
          type="text"
          id="messageInput"
          placeholder="Message #general"
        />

        <button onclick="sendMessage()">
          Send
        </button>

      </div>

    </div>

  </main>

  <!-- MEMBERS -->

  <aside class="members-panel">

    <div class="members-title">
      ONLINE — 3
    </div>

    <div class="member-item">

      <div class="member-avatar"></div>

      <span>Icey</span>

    </div>

    <div class="member-item">

      <div class="member-avatar"></div>

      <span>Winter</span>

    </div>

    <div class="member-item">

      <div class="member-avatar"></div>

      <span>Frost</span>

    </div>

  </aside>

</body>

</html>
