<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Blue Icee Realms</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="supabase.js"></script>

  <script defer src="chat.js"></script>

</head>

<body class="chat-body">

  <!-- SERVER SIDEBAR -->

  <div class="server-bar">

    <div class="server-icon active">
      ❄️
    </div>

    <div class="server-icon">
      🎤
    </div>

    <div class="server-icon">
      ☕
    </div>

    <div class="server-icon">
      🕹️
    </div>

    <div class="server-icon">
      💖
    </div>

  </div>

  <!-- CHANNEL SIDEBAR -->

  <div class="channel-sidebar">

    <div class="sidebar-logo">

      <div class="logo-circle"></div>

      <h2>Blue Icee</h2>

    </div>

    <div class="channel-group">

      <p class="channel-title">
        REALMS
      </p>

      <button onclick="switchRealm('general')">
        # general
      </button>

      <button onclick="switchRealm('kpop')">
        # k-pop
      </button>

      <button onclick="switchRealm('cozy')">
        # cozy
      </button>

      <button onclick="switchRealm('arcade')">
        # arcade
      </button>

    </div>

  </div>

  <!-- MAIN CHAT -->

  <div class="main-chat">

    <div class="chat-header">

      <h2 id="realmName">
        # general
      </h2>

      <p>
        icy realm discussions ✨
      </p>

    </div>

    <div
      class="chat-messages"
      id="chatMessages"
    >
    </div>

    <div class="chat-input-area">

      <button class="chat-icon">
        😊
      </button>

      <button class="chat-icon">
        📷
      </button>

      <input
        type="text"
        id="messageInput"
        placeholder="Message realm..."
      />

      <button
        class="send-btn"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>

  <!-- MEMBERS -->

  <div class="members-sidebar">

    <h3>ONLINE</h3>

    <div class="member">

      <div class="member-pfp"></div>

      <span>Ice Princess</span>

    </div>

    <div class="member">

      <div class="member-pfp"></div>

      <span>KPop Bunny</span>

    </div>

    <div class="member">

      <div class="member-pfp"></div>

      <span>FrostyCat</span>

    </div>

  </div>

</body>

</html>
