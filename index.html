<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Blue Icee</title>

  <link rel="stylesheet" href="style.css"/>

  <script defer src="script.js"></script>
</head>

<body>

  <div class="background-glow"></div>

  <nav class="navbar">

    <div class="logo-section">
      <div class="logo-circle"></div>
      <h1>Blue Icee</h1>
    </div>
<div class="theme-switcher">

  <button onclick="setTheme('dark')">
    🌑
  </button>

  <button onclick="setTheme('frost')">
    ❄️
  </button>

  <button onclick="setTheme('aurora')">
    🌌
  </button>

  <button onclick="setTheme('pink')">
    💖
  </button>

</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Realms</a>
      <a href="#">Arcade</a>
      <a href="#">Inventory</a>
      <a href="#">Profile</a>
    </div>

  </nav>

  <main class="hero">

    <div class="glass-card floating">

      <h2>Blue Icee</h2>

      <p>
        Chill, collect, chat, and explore magical icy realms ✨
      </p>

      <div class="hero-buttons">

        <button class="primary-btn">
          Enter Realm
        </button>

        <button class="secondary-btn">
          Open Arcade
        </button>

      </div>

    </div>

  </main>

  <section class="realms-section">

    <h3>Popular Realms</h3>

    <div class="realm-grid">

      <div class="realm-card">
        <h4>K-Pop Realm</h4>
        <p>Trade cards & meet fans</p>
      </div>

      <div class="realm-card">
        <h4>Cozy Realm</h4>
        <p>Relax and chat together</p>
      </div>

      <div class="realm-card">
        <h4>Arcade Realm</h4>
        <p>Play mini games & claw machines</p>
      </div>

    </div>

  </section>

</body>
</html>
