<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Blue Icee</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="supabase.js"></script>

  <script defer src="script.js"></script>

</head>

<body>

  <div class="background-glow"></div>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="logo-section">

      <div class="logo-circle"></div>

      <h1>Blue Icee</h1>

    </div>

    <!-- THEMES -->

    <div class="theme-switcher">

      <button onclick="setTheme('dark')">
        🌑
      </button>

      <button onclick="setTheme('frost')">
        ❄️
      </button>

      <button onclick="setTheme('aurora')">
        🌌
      </button>

      <button onclick="setTheme('pink')">
        💖
      </button>

    </div>

    <!-- LINKS -->

    <div class="nav-links">

      <a href="#">Home</a>

      <a href="./chat.html">Realms</a>

      <a href="#">Arcade</a>

      <a href="#">Inventory</a>

      <a href="#">Profile</a>

      <button
        class="login-btn"
        onclick="openLogin()"
      >
        Login
      </button>

    </div>

  </nav>

  <!-- HERO -->

  <main class="hero">

    <div class="glass-card floating">

      <h2>Blue Icee</h2>

      <p>
        Chill, collect, chat, and explore magical icy realms ✨
      </p>

      <div class="hero-buttons">

        <button
          class="primary-btn"
          onclick="window.location.href='./chat.html'"
        >
          Enter Realm
        </button>

        <button class="secondary-btn">
          Open Arcade
        </button>

      </div>

    </div>

  </main>

  <!-- REALMS -->

  <section class="realms-section">

    <h3>Popular Realms</h3>

    <div class="realm-grid">

      <div class="realm-card">

        <h4>K-Pop Realm</h4>

        <p>
          Trade cards & meet fans
        </p>

      </div>

      <div class="realm-card">

        <h4>Cozy Realm</h4>

        <p>
          Relax and chat together
        </p>

      </div>

      <div class="realm-card">

        <h4>Arcade Realm</h4>

        <p>
          Play mini games & claw machines
        </p>

      </div>

    </div>

  </section>

  <!-- LOGIN MODAL -->

  <div
    class="login-modal"
    id="loginModal"
  >

    <div class="login-box">

      <button
        class="close-modal"
        onclick="closeLogin()"
      >
        ✕
      </button>

      <h2>Blue Icee Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Email"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
      />

      <button onclick="signup()">
        Sign Up
      </button>

      <button onclick="login()">
        Login
      </button>

    </div>

  </div>

</body>

</html>
